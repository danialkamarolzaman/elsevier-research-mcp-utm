name: Feature request
description: Suggest a new tool, setting or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The research task, and where the current tools fall short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
      description: Which Elsevier / OpenAlex API endpoint it would use, if you know.
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: This works through official APIs only (no scraping, no EZproxy automation) and keeps the download limits
          required: true
